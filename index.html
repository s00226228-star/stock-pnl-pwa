function sum(a){return a.reduce((v,r)=>v+Number(r.pnl||0),0)}function stats(a){let w=a.filter(r=>r.pnl>0).length,l=a.filter(r=>r.pnl<0).length,z=a.length-w-l;return {w,l,z,rate:w+l?100*w/(w+l):null,profit:sum(a.filter(r=>r.pnl>0)),loss:sum(a.filter(r=>r.pnl<0))}}function daily(a){let m={};for(let r of a)m[r.date]=(m[r.date]||0)+Number(r.pnl);return m}function results(a){let s=stats(a);return [s.w,s.l,s.z].map((v,i)=>v?v+['勝','敗','分'][i]:'').filter(Boolean).join('')||'記録なし'}function renderCalendar(){let arr=records.filter(r=>ym(r.date)===month),s=stats(arr),p=new Date(month+'-01T12:00:00'),prev=new Date(p);prev.setMonth(prev.getMonth()-1);let pm=ym(prev.toLocaleDateString('sv-SE')),pa=records.filter(r=>ym(r.date)===pm),diff=pa.length?'<span class="'+cls(sum(arr)-sum(pa))+'">前月比 '+money(sum(arr)-sum(pa))+'</span>':'比較データなし';let first=p.getDay(),days=new Date(p.getFullYear(),p.getMonth()+1,0).getDate(),map=daily(arr),cells='';for(let i=0;i<first;i++)cells+='<div class="day blank"></div>';for(let i=1;i<=days;i++){let date=month+'-'+String(i).padStart(2,'0'),v=map[date],has=Object.hasOwn(map,date);cells+=`<button class="day ${date===today()?'today':''} ${selected===date?'selected':''}" onclick="pick('${date}')" oncontextmenu="event.preventDefault();openEditor(null,'${date}')"><div class="num">${i}</div><div class="amt ${cls(v||0)}">${has?(v>0?'+':'')+Number(v).toLocaleString('ja-JP'):''}</div></button>`}let detailhtml='';if(selected&&ym(selected)===month&&detail){let rs=arr.filter(r=>r.date===selected),ds=stats(rs);detailhtml=`<section class="card"><div class="row"><b>${selected.replaceAll('-','/')} の取引</b><button class="btn" onclick="detail=false;render()">×</button></div><div class="row" style="margin-top:8px"><b>${money(sum(rs))}</b><span class="muted">${rs.length}件 · ${results(rs)}</span></div>${rs.length?rs.map(recordHtml).join(''):'<div class="empty">この日の取引記録はありません</div><button class="btn" onclick="openEditor(null,selected)">この日に取引を追加</button>'}</section>`}return `<section class="card"><div class="muted">${month.replace('-','年')}月 の実現損益</div><div class="row"><div class="big" onclick="monthlyDetails()">${money(sum(arr))}</div><button class="btn" onclick="monthlyDetails()">詳細</button></div><div class="muted">${diff}</div><hr class="line"><div class="row"><span>勝率（取引） <b>${s.rate===null?'—':s.rate.toFixed(1)+'%'}</b></span><span>日別成績 <b>${results(Object.values(daily(arr)).map(pnl=>({pnl})))}</b></span></div></section><section class="card"><div class="row"><button class="btn" onclick="shift(-1)">‹</button><b>${p.getFullYear()}年 ${p.getMonth()+1}月</b><button class="btn" onclick="shift(1)">›</button><button class="btn" onclick="month=ym(today());selected=today();detail=true;render()">今月</button></div><div class="calendar" id="calendarSwipe">${['日','月','火','水','木','金','土'].map(d=>'<div class="dow">'+d+'</div>').join('')}${cells}</div><div class="hint">日付をタップすると明細を表示します。日付の長押しで登録できます。</div></section>${detailhtml}`}
function recordHtml(r){return `<div class="record" onclick="showRecord('${r.id}')"><div class="row"><div><b>${esc(r.name||r.code||'銘柄未入力')}</b> <span class="muted">${esc(r.code||'')}</span></div><b>${money(r.pnl)}</b></div><div class="muted">${esc(r.time||'')} ${esc(r.method||'')} ${r.tags?esc(r.tags):''}</div>${r.memo?'<div class="hint">'+esc(r.memo).slice(0,110)+'</div>':''}</div>`}function pick(d){if(selected===d&&detail)return;selected=d;detail=true;render()}// Swipe navigation: horizontal gestures on the calendar only; vertical scrolling remains native.

const calendarRoot=document.querySelector('#main');

function openHistory(period=''){history=true;hperiod=period;hlimit=50;render()}function filtered(){let a=records.filter(r=>(!hperiod||ym(r.date)===hperiod)&&(!hfilter||[r.code,r.name].some(v=>String(v||'').toLowerCase().includes(hfilter.toLowerCase()))));return a.sort((a,b)=>hsort==='high'?b.pnl-a.pnl:hsort==='low'?a.pnl-b.pnl:b.date.localeCompare(a.date)||String(b.time||'').localeCompare(a.time||''))}function renderHistory(){let a=filtered();return `<section class="card"><div class="row"><button class="btn" onclick="history=false;render()">‹ 戻る</button><b>取引履歴</b><button class="btn" onclick="historyMenu()">︙</button></div><label class="field">銘柄検索<input id="search" value="${esc(hfilter)}" placeholder="銘柄名・コード" oninput="hfilter=this.value;hlimit=50;updateHistory()"></label><div class="row wraprow"><label>期間 <input type="month" value="${hperiod}" onchange="hperiod=this.value;hlimit=50;render()"></label><select onchange="hsort=this.value;render()"><option value="new" ${hsort==='new'?'selected':''}>新しい順</option><option value="high" ${hsort==='high'?'selected':''}>利益が大きい順</option><option value="low" ${hsort==='low'?'selected':''}>損失が大きい順</option></select><button class="btn" onclick="hperiod='';hfilter='';render()">条件をクリア</button></div></section><section class="card" id="historyResults">${historyRows(a)}</section>`}function updateHistory(){let a=filtered();$('#historyResults').innerHTML=historyRows(a)}function historyRows(a){return `<div class="row"><b>${a.length}件</b><b>${money(sum(a))}</b></div>${a.length?a.slice(0,hlimit).map(r=>`<div class="record" onclick="showRecord('${r.id}')"><div class="muted">${esc(r.date)}</div>${recordHtml(r)}</div>`).join(''):'<div class="empty">条件に一致する取引はありません</div>'}${a.length>hlimit?'<button class="btn" onclick="hlimit+=50;render()">さらに50件表示</button>':''}`}function historyMenu(){sheet('取引履歴メニュー',`<button class="btn" onclick="closeSheet();openEditor()">新しい取引を登録</button> <button class="btn" onclick="closeSheet();exportCsv()">CSV出力</button>` function renderAnalysis(){let a=records,s=stats(a),d=daily(a),vals=Object.entries(d).sort((x,y)=>x[0].localeCompare(y[0]));let best=vals.length?Math.max(...vals.map(x=>x[1])):0,worst=vals.length?Math.min(...vals.map(x=>x[1])):0;let methods=[...new Set(a.map(r=>r.method||'未設定'))];return `<section class="card"><h3>損益分析（全期間）</h3><div class="big">${money(sum(a))}</div><div class="statgrid"><div class="stat">勝率（取引）<b>${s.rate===null?'—':s.rate.toFixed(1)+'%'}</b></div><div class="stat">取引件数<b>${a.length}</b></div><div class="stat">利益合計<b>${money(s.profit)}</b></div><div class="stat">損失合計<b>${money(s.loss)}</b></div><div class="stat">最高日損益<b>${money(best)}</b></div><div class="stat">最低日損益<b>${money(worst)}</b></div><div class="stat">平均日損益<b>${money(vals.length?Math.round(sum(a)/vals.length):0)}</b></div><div class="stat">プロフィットファクター<b>${s.loss?Math.abs(s.profit/s.loss).toFixed(2):'—'}</b></div></div></section><section class="card"><h3>取引方法別</h3>${methods.map(m=>`<div class="record row"><b>${esc(m)}</b><span>${money(sum(a.filter(r=>(r.method||'未設定')===m)))}</span></div>`).join('')||'<div class="empty">取引記録なし</div>'}</section><section class="card"><h3>銘柄別損益</h3>${Object.entries(Object.groupBy?Object.groupBy(a,r=>r.code||r.name||'未設定'):a.reduce((o,r)=>{(o[r.code||r.name||'未設定']??=[]).push(r);return o},{})).sort((x,y)=>sum(y[1])-sum(x[1])).map(([k,v])=>`<div class="record row"><b>${esc(v[0].name||k)} <small>${esc(k)}</small></b>${money(sum(v))}</div>`).join('')||'<div class="empty">取引記録なし</div>'}</section>`}function renderAnnual(){let years=[...new Set(records.map(r=>r.date.slice(0,4)))].sort().reverse();if(!years.length)years=[today().slice(0,4)];return years.map(y=>`<section class="card"><h3>${y}年 <span class="red">${money(sum(records.filter(r=>r.date.startsWith(y))))}</span></h3>${Array.from({length:12},(_,i)=>{let m=y+'-'+String(i+1).padStart(2,'0'),a=records.filter(r=>ym(r.date)===m);return `<div class="record row" onclick="month='${m}';selected=null;detail=false;go('cal function renderSettings(){return `<section class="card"><h3>データの保存状況</h3><div class="statgrid"><div class="stat">登録取引件数<b>${records.length}件</b></div><div class="stat">下書き件数<b>${drafts.length}件</b></div></div><p class="hint">最終バックアップ：${meta.lastBackup?new Date(meta.lastBackup).toLocaleString('ja-JP'):'未作成'}</p></section><section class="card"><h3>バックアップ・復元</h3><p class="hint">取引・下書き・設定をJSON形式で保存します。端末変更前には必ずバックアップしてください。</p><button class="btn primary" onclick="backup()">JSONバックアップ</button> <button class="btn" onclick="chooseFile('json')">JSON復元</button></section><section class="card"><h3>データの取込・出力</h3><button class="btn" onclick="chooseFile('csv')">CSV取込</button> <button class="btn" onclick="exportCsv()">CSV出力</button><p class="hint">CSVは「日付,銘柄コード,銘柄名,損益,取引方法,タグ,メモ」の列に対応します。SBI特定口座損益明細（Shift_JIS）に対応。税額は受渡日ごとの按分推定です。</p></section><section class="card"><h3>下書き</h3>${drafts.sort((a,b)=>b.updated.localeCompare(a.updated)).map(d=>`<div class="record row"><span>${esc(d.data.date)} ${esc(d.data.name||d.data.code||'未入力')}</span><span><button class="btn" onclick="openEditor(null,null,false,'${d.id}')">再開</button> <button class="btn danger" onclick="deleteDraft('${d.id}')">削除</button></span></div>`).join('')||'<div class="muted">下書きはありません</div>'}</section><section class="card"><h3>アプリ情報</h3><p>バージョン 0.1.2（SBI CSV対応）</p><button class="btn" onclick="showGuide()">使い方を見る</button><p class="hint">データはこの端末・ブラウザに保存されます。ブラウザのデータ消去で失われる場合があります。</p></section><section class="card"><h3>危険な操作</h3><button class="btn danger" onclick="resetAll()">すべてのデータを削除</button></section>`}
function sheet(title,html){modalStack.push(1);$('#modal').innerHTML=`<div class="sheetwrap" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="row"><h2>${esc(title)}</h2><button class="btn" onclick="closeSheet()">×</button></div>${html}</div></div>`;historyPush()}function closeSheet(){modalStack.pop();$('#modal').innerHTML=''}function historyPush(){window.history.pushState({overlay:true},'','#dialog')}window.addEventListener('popstate',()=>{if(modalStack.length)closeSheet();else if(history){history=false;render()}else if(tab!=='calendar')go('calendar');else if(confirm('アプリを終了しますか？')){}else historyPush()});function toast(msg,undo){let el=document.createElement('div');el.style='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#142b4a;color:white;padding:13px 18px;border-radius:10px;z-index:50;white-space:nowrap';el.textContent=msg;if(undo)el.onclick=()=>{undo();el.remove()};document.body.append(el);setTimeout(()=>el.remove(),undo?15000:3000)}
function openEditor(id=null,date=null,copy=false,draftId=null){let r=id?records.find(x=>x.id===id):null,d=draftId?drafts.find(x=>x.id===draftId):null,initial=d?.data||(r?{...r,pnl:copy?'':r.pnl,date:copy?today():r.date}:{});editId=copy?null:id;let x={date:date||initial.date||selected||today(),code:initial.code||'',name:initial.name||'',pnl:initial.pnl??'',time:initial.time||'',method:initial.method||'',tags:initial.tags||'',memo:initial.memo||''};sheet(editId?'取引を編集':'取引を登録',`<form id="tradeForm" onsubmit="saveTrade(event,'${draftId||''}')"><label class="field">日付（必須）<input name="date" type="date" required value="${esc(x.date)}"></label><label class="field">銘柄コード<input name="code" placeholder="例：7203" value="${esc(x.code)}"></label><label class="field">銘柄名<input name="name" placeholder="例：トヨタ自動車" value="${esc(x.name)}"></label><label class="field">税・手数料控除後の実現損益（円・必須）<input name="pnl" type="number" step="1" required placeholder="利益は正、損失は負" value="${esc(x.pnl)}"></label><label class="field">約定時刻（任意）<input name="time" type="time" value="${esc(x.time)}"></label><label class="field">取引方法<select name="method">${['','デイトレード','スイング','長期保有','その他'].map(v=>`<option ${v===x.method?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">タグ（ / 区切り）<input name="tags" value="${esc(x.tags)}"></label><label class="field">メモ<textarea name="memo">${esc(x.memo)}</textarea></label><div class="row"><button class="btn" type="button" onclick="saveDraft('${draftId||''}')">下書き保存</button><button class="btn primary" type="submit">${editId?'変更を保存':'取引を登録'}</button></div></form>`)}function formData(){return Object.fromEntries(new FormData($('#tradeForm')).entries())}async function saveTrade(e,did){e.preventDefault();let x=formData();if(!x.date||x.pnl===''||!Number.isInteger(Number(x.pnl))){alert('日付と整数の損益を入力してください');return}let old=records.find(r=>r.id===editId);let obj={...old,...x,pnl:Number(x.pnl),id:editId||uid(),created:old?.created||stamp()};await put('records',obj);if(did)await del('drafts',did);closeSheet();if(!history){month=ym(obj.date);selected=obj.date;detail=true}render();toast('取引を保存しました')}async function saveDraft(id){let x=formData();await put('drafts',{id:id||uid(),data:x,updated:stamp()});closeSheet();render();toast('下書きを保存しました')}async function deleteDraft(id){if(confirm('下書きを削除しますか？')){await del('drafts',id);render()}}
function filename(prefix,ext){let d=new Date();return prefix+'_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'.'+ext}function download(content,name,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}async function backup(){let data={app:'stock-pnl-jp',version:1,created:stamp(),records,drafts,meta};download(JSON.stringify(data,null,2),filename('株式収支バックアップ','json'),'application/json');await setmeta('lastBackup',stamp());render();toast('JSONバックアップを作成しました')}function chooseFile(type){let el=$('#file');el.accept=type==='json'?'.json,application/json':'.csv,text/csv';el.onchange=async()=>{let f=el.files[0];if(!f)return;try{let text=type==='csv'?await decodeCsvFile(f):await f.text();if(type==='json')await restoreJson(text);else await importCsv(text)}catch(e){alert('ファイルを読み込めませんでした：'+e.message)}el.value=''};el.click()}
async function restoreJson(text){let data=JSON.parse(text);if(data.app!=='stock-pnl-jp'||!Array.isArray(data.records))throw Error('対応するバックアップではありません');let existing=new Map(records.map(r=>[r.id,r])),add=data.records.filter(r=>!existing.has(r.id)).length,update=data.records.filter(r=>existing.has(r.id)&&JSON.stringify(existing.get(r.id))!==JSON.stringify(r)).length;if(!confirm(`バックアップ日時：${data.created||'不明'}\n取引 ${data.records.length}件、下書き ${(data.drafts||[]).length}件\n新規 ${add}件、更新 ${update}件\n復元を実行しますか？`))return;await new Promise((ok,no)=>{let t=db.transaction(['records','drafts','meta'],'readwrite');for(let r of data.records)t.objectStore('records').put(r);for(let d of data.drafts||[])t.objectStore('drafts').put(d);t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)});await reload();render();sheet('復元完了',`<p>新規 ${add}件 / 更新 ${update}件 / 重複スキップ ${data.records.length-add-update}件</p><button class="btn primary" onclick="closeSheet();history=false;tab='calendar';month=ym(today());selected=today();detail=true;render()">カレンダーに戻る</button>`)}
function csvCell(s){return '"'+String(s??'').replaceAll('"','""')+'"'}function exportCsv(){let a=history?filtered():records;if(!a.length){alert('出力する取引がありません');return}if(!confirm(`${a.length}件の取引をCSV出力しますか？`))return;let rows=[['日付','時刻','銘柄コード','銘柄名','実現損益','取引方法','タグ','メモ'],...a.map(r=>[r.date,r.time,r.code,r.name,r.pnl,r.method,r.tags,r.memo])];download('\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),filename('株式取引履歴','csv'),'text/csv;charset=utf-8');toast(`${a.length}件の取引をCSV出力しました`)}function parseCSV(t){let out=[],row=[],v='',quote=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(quote&&t[i+1]==='"'){v+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&t[i+1]==='\n')i++;row.push(v);if(row.some(Boolean))out.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(Boolean))out.push(row);return out}async function decodeCsvFile(file){let buf=await file.arrayBuffer(),utf=new TextDecoder('utf-8',{fatal:true});try{return utf.decode(buf)}catch(e){return new TextDecoder('shift_jis').decode(buf)}}
function parseMoney(v){let t=String(v??'').replace(/[,+\s円]/g,'').trim();return /^-?\d+$/.test(t)?Number(t):null}
function normalizeDate(v){let m=String(v??'').match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/);return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:''}
function allocateAmount(items,total,weightKey){if(!items.length||!total)return;let weights=items.map(r=>Math.max(0,Math.abs(r[weightKey]||0))),w=weights.reduce((a,b)=>a+b,0);if(!w)weights=items.map(()=>1),w=items.length;let assigned=0;items.forEach((r,i)=>{let n=i===items.length-1?total-assigned:Math.floor(total*weights[i]/w);r.taxAdjustment=(r.taxAdjustment||0)+n;assigned+=n})}
function parseSbiCsv(rows){let headerIndex=rows.findIndex(r=>r.includes('銘柄コード')&&r.includes('損益金額/徴収額')&&r.includes('約定日'));if(headerIndex<0)return null;let header=rows[headerIndex],col=x=>header.indexOf(x),out=[],taxRows=[],ordinal=new Map();for(let row of rows.slice(headerIndex+1)){let code=String(row[col('銘柄コード')]||'').trim(),raw=String(row[col('損益金額/徴収額')]||'').trim(),settle=normalizeDate(row[col('受渡日')]);if(code==='譲渡益税徴収額'||code==='譲渡益税還付金'){let local=parseMoney(row[col('地方税')])||0,amount=parseMoney(raw)||0;taxRows.push({settle,amount:amount+local,refund:code==='譲渡益税還付金'});continue}let date=normalizeDate(row[col('約定日')]),gross=parseMoney(raw);if(!/^\d{4,5}$/.test(code)||!date||gross===null)continue;let name=String(row[col('銘柄')]||'').trim(),quantity=String(row[col('数量')]||'').trim(),type=String(row[col('取引')]||'').trim(),signature=[date,settle,code,name,quantity,type,gross].join('|'),occ=(ordinal.get(signature)||0)+1;ordinal.set(signature,occ);out.push({id:uid(),date,code,name,pnl:gross,gross,settle,quantity,type,method:'',tags:'',memo:'',created:stamp(),importKey:'sbi:'+signature+'|'+occ})}
for(let t of taxRows){let same=out.filter(r=>r.settle===t.settle);let candidates=same.filter(r=>t.refund?r.gross<0:r.gross>0);if(!candidates.length)candidates=same;allocateAmount(candidates,t.amount,'gross');for(let r of candidates)r.hasTaxLine=true}
for(let r of out){r.pnl=r.gross+(r.taxAdjustment||0)*(r.gross<0?1:-1);r.memo=`SBI特定口座損益明細／受渡日 ${r.settle}／${r.quantity} ${r.type}／税引前 ${r.gross}円`+(r.hasTaxLine?'／税額を同受渡日の取引に按分':'／対応する税額行なし');delete r.gross;delete r.settle;delete r.quantity;delete r.type;delete r.taxAdjustment;delete r.hasTaxLine}
return {out,taxRows}}
async function importCsv(t){let rows=parseCSV(t.replace(/^\ufeff/,''));let sbi=parseSbiCsv(rows),incoming=[];if(sbi){incoming=sbi.out;if(!incoming.length)throw Error('SBI取引明細を認識しましたが、取引を抽出できませんでした');}else{let header=rows.shift()||[],col=(...names)=>header.findIndex(x=>names.some(n=>x.includes(n))),idx={date:col('日付','約定日'),time:col('時刻','約定時間'),code:col('銘柄コード','コード'),name:col('銘柄名','銘柄'),pnl:col('実現損益','損益','受渡金額'),method:col('取引方法'),tags:col('タグ'),memo:col('メモ')};if(idx.date<0||idx.pnl<0)throw Error('日付・損益列を判別できません。対応形式のCSVを使用してください');incoming=rows.map(row=>{let get=k=>idx[k]<0?'':row[idx[k]]||'';return {id:uid(),date:normalizeDate(get('date')),code:get('code').trim(),name:get('name').trim(),pnl:parseMoney(get('pnl')),time:get('time'),method:get('method'),tags:get('tags'),memo:get('memo'),created:stamp()}}).filter(r=>r.date&&Number.isInteger(r.pnl))}
let existingKeys=new Set(records.filter(r=>r.importKey).map(r=>r.importKey)),existingCount=new Map();for(let r of records.filter(r=>!r.importKey)){let key=[r.date,r.code,r.name,r.pnl,r.time||''].join('|');existingCount.set(key,(existingCount.get(key)||0)+1)}let seenCount=new Map(),fresh=[];for(let r of incoming){if(r.importKey){if(!existingKeys.has(r.importKey)){fresh.push(r);existingKeys.add(r.importKey)}}else{let key=[r.date,r.code,r.name,r.pnl,r.time||''].join('|'),n=(seenCount.get(key)||0)+1;seenCount.set(key,n);if(n> (existingCount.get(key)||0))fresh.push(r)}}
let total=sum(incoming),newTotal=sum(fresh),warning=sbi?'\n※SBIの税額・還付額は受渡日ごとに各取引へ按分した推定税引後損益です。個別の正確な税引後損益とは異なる場合があります。':'',message=`${sbi?'SBI特定口座損益明細を認識しました。':'CSVを認識しました。'}\n抽出 ${incoming.length}件／重複スキップ ${incoming.length-fresh.length}件\n新規登録 ${fresh.length}件（合計 ${newTotal.toLocaleString('ja-JP')}円）\n抽出全件の損益合計 ${total.toLocaleString('ja-JP')}円${warning}\n\n登録しますか？`;if(!confirm(message))return;if(!fresh.length){toast('新規登録する取引はありません');return}await new Promise((ok,no)=>{let t=db.transaction('records','readwrite');for(let r of fresh)t.objectStore('records').put(r);t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)});await reload();render();toast(`${fresh.length}件を取り込みました`)}
async function resetAll(){if(prompt('全データを削除します。「初期化」と入力してください')!=='初期化')return;await new Promise((ok,no)=>{let t=db.transaction(['records','drafts','meta'],'readwrite');for(let n of ['records','drafts','meta'])t.objectStore(n).clear();t.oncomplete=ok;t.onerror=()=>no(t.error)});await reload();month=ym(today());selected=today();go('calendar');toast('データを初期化しました')}function showGuide(){sheet('株式収支手帖の使い方',`<p>① カレンダー右下の「＋」で取引を登録します。</p><p>② 設定画面からCSV取込ができます。</p><p>③ 分析・年間成績で損益を確認できます。</p><p>④ 定期的にJSONバックアップを保存してください。</p><button class="btn primary" onclick="setmeta('guide',true);closeSheet()">使い始める</button>`)}function showBackupReminder(){sheet('バックアップのご案内',`<p>前回のバックアップから30日以上経過しています。</p><button class="btn primary" onclick="closeSheet();backup()">バックアップする</button> <button class="btn" onclick="setmeta('snooze',new Date(Date.now()+7*864e5).toISOString());closeSheet()">あとで（7日間）</button>`)}
init().catch(e=>{$('#main').innerHTML='<section class="card"><h3>保存データを読み込めません</h3><p>既存データを初期化せず、操作を停止しました。</p><button class="btn" onclick="location.reload()">再試行</button><p class="hint">'+esc(e.message)+'</p></section>'});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
