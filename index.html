function sum(a){return a.reduce((v,r)=>v+Number(r.pnl||0),0)}function stats(a){let w=a.filter(r=>r.pnl>0).length,l=a.filter(r=>r.pnl<0).length,z=a.length-w-l;return {w,l,z,rate:w+l?100*w/(w+l):null,profit:sum(a.filter(r=>r.pnl>0)),loss:sum(a.filter(r=>r.pnl<0))}}function daily(a){let m={};for(let r of a)m[r.date]=(m[r.date]||0)+Number(r.pnl);return m}function taxAttribution(ledger=meta.sbiTaxLedger||[],tradeRows=records){

function parseSbiExecutions(rows){

  const r=rows[i],code=String(r[ix('銘柄コード')]||'').trim(),date=normalizeDate(r[ix('約定日')]);
  const type=String(r[ix('取引')]||'').trim();

  const qty=parseDecimal(r[ix('約定数量')]),price=parseDecimal(r[ix('約定単価')]);

function calculateExecutionPnL(orders){

    type=String(row[ix('取引')]||'').trim(),fee=parseMoney(row[ix('費用')]);
  const sig=[date,settle,code,quantity,type,gross].join('|'),occ=(ordinal.get(sig)||0)+1;ordinal.set(sig,occ);
  out.push({id:uid(),date,code,name,pnl:gross,settle,quantity,type,fee,method:'',tags:'',memo:`SBI特定口座損益明細／税務上の損益 ${gross}円（平均取得単価の端数処理を含む）／税金は受渡日別に管理`,created:stamp(),importKey:'sbi:'+ [date,settle,code,name,qtyText,type,gross].join('|')+'|'+occ,source:'SBI特定口座損益明細',calcMethod:'statement',statementPnl:gross});
 }
 return {out,taxRows};
}
function isStatement(r){return r.calcMethod==='statement'||String(r.importKey||'').startsWith('sbi:')}
function isExecution(r){return r.calcMethod==='execution-weighted-average'||String(r.importKey||'').startsWith('sbi-exec:')}
function matchKey(r){const q=Number(r.quantity)||Number(String(r.memo||'').match(/(?:／|^)\s*(\d+)株/)?.[1])||0;return [r.date,r.code,q].join('|')}
// 明細と約定履歴の売却を、約定日・銘柄コード・数量で一対一照合する。
// 同じ条件の複数約定はCSV内の出現順で対応させ、曖昧さを画面に表示する。
function linkSbiRecords(incoming,kind){
 const pool=records.filter(kind==='exec'?isStatement:isExecution),used=new Set(),updated=[],fresh=[],ambiguous=[];
 const byKey=new Map();for(const r of pool){const k=matchKey(r);if(!byKey.has(k))byKey.set(k,[]);byKey.get(k).push(r)}
 for(const r of incoming){
  const matches=(byKey.get(matchKey(r))||[]).filter(x=>!used.has(x.id));
  if(matches.length){
   const old=matches[0];used.add(old.id);
   if(matches.length>1)ambiguous.push(`${r.date} ${r.code} ${r.quantity}株`);
   const merge=kind==='exec'?{...old,...r,id:old.id,created:old.created,statementPnl:old.statementPnl??Number(String(old.memo||'').match(/税引前\s*([+-]?\d+)円/)?.[1]??old.pnl),statementImportKey:old.importKey,importKey:r.importKey,calcMethod:r.calcMethod,source:'SBI約定履歴＋特定口座損益明細',memo:r.memo+'／税務上の損益 '+(old.statementPnl??Number(String(old.memo||'').match(/税引前\s*([+-]?\d+)円/)?.[1]??old.pnl))+'円'}:
     {...old,pnl:old.pnl,statementPnl:r.statementPnl,statementImportKey:r.importKey,source:'SBI約定履歴＋特定口座損益明細',settle:r.settle,quantity:r.quantity||old.quantity,feeStatement:r.fee, memo:(old.memo||'')+'／税務上の損益 '+r.statementPnl+'円'};
   updated.push(merge);
  }else fresh.push(r);
 }
 return {updated,fresh,ambiguous};
}
async function commitSbi(items,taxRows=[]){
 const oldTax=Array.isArray(meta.sbiTaxLedger)?meta.sbiTaxLedger:[];
 const taxMap=new Map(oldTax.map(x=>[x.key,x]));let addedTax=0;
 for(const x of taxRows)if(!taxMap.has(x.key)){taxMap.set(x.key,x);addedTax++}
 await new Promise((ok,no)=>{const t=db.transaction(['records','meta'],'readwrite');for(const r of items)t.objectStore('records').put(r);t.objectStore('meta').put({key:'sbiTaxLedger',value:[...taxMap.values()]});t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)});
 await reload();render();return addedTax;
}
async function importSbiStatement(parsed){
 const existing=new Set(records.flatMap(r=>[r.statementImportKey,r.importKey].filter(Boolean)));
 const incoming=parsed.out.filter(r=>!existing.has(r.importKey));
 const merged=linkSbiRecords(incoming,'statement');
 // 旧版で税額を取引に按分済みの明細は、再取込時に税引前の明細値へ戻す。
 const fixedLegacy=records.filter(r=>isStatement(r)&&!isExecution(r)&&/税引前\s*[+-]?\d+円/.test(r.memo||'')).map(r=>({...r,pnl:Number(String(r.memo).match(/税引前\s*([+-]?\d+)円/)[1]),statementPnl:Number(String(r.memo).match(/税引前\s*([+-]?\d+)円/)[1]),calcMethod:'statement'})).filter(r=>records.find(x=>x.id===r.id)?.pnl!==r.pnl);
 const mergedIds=new Set(merged.updated.map(r=>r.id));
 const oldTax=new Set((meta.sbiTaxLedger||[]).map(x=>x.key));const newTax=parsed.taxRows.filter(x=>!oldTax.has(x.key));
  const attributionPreview=taxAttribution(parsed.taxRows,[...records,...merged.updated,...merged.fresh]);
  const resolvedCount=attributionPreview.filter(x=>x.attribution==='trade-date').length;
  const unresolvedCount=attributionPreview.length-resolvedCount;
 const warning=merged.ambiguous.length?'\n※同日・同銘柄・同数量の複数取引は対応付けが曖昧です。取り込み後に確認してください。':'';
 if(!confirm(`SBI特定口座損益明細\n明細 ${parsed.out.length}件\n約定履歴と統合 ${merged.updated.length}件\n明細のみ新規登録 ${merged.fresh.length}件\n既存と重複 ${parsed.out.length-incoming.length}件\n旧版の税額按分を補正 ${fixedLegacy.filter(r=>!mergedIds.has(r.id)).length}件\n税額調整 新規 ${newTax.length}件（合計 ${newTax.reduce((n,x)=>n+x.amount,0)}円）\n約定日へ対応付け ${resolvedCount}件／受渡日で仮表示 ${unresolvedCount}件\n\n約定履歴がある取引は約定価格ベースの損益を維持します。明細のみの取引は税務上の損益として区別します。税額は個々の売却に按分せず、受渡日から対応する約定日を特定して日別に管理します。${warning}\n\n取り込みますか？`))return;
 const n=await commitSbi([...fixedLegacy.filter(r=>!mergedIds.has(r.id)),...merged.updated,...merged.fresh],parsed.taxRows);toast(`取引 ${merged.updated.length}件統合・${merged.fresh.length}件追加、税額 ${n}件登録`);
}
async function importCsv(t){
 const rows=parseCSV(t.replace(/^\ufeff/,'')),exec=parseSbiExecutions(rows);
 if(exec)return await importExecutionCsv(rows);
 const sbi=parseSbiCsv(rows);if(sbi)return await importSbiStatement(sbi);
 const header=rows.shift()||[],col=(...names)=>header.findIndex(x=>names.some(n=>x.includes(n))),idx={date:col('日付','約定日'),time:col('時刻','約定時間'),code:col('銘柄コード','コード'),name:col('銘柄名','銘柄'),pnl:col('実現損益','損益','受渡金額'),method:col('取引方法'),tags:col('タグ'),memo:col('メモ')};
 if(idx.date<0||idx.pnl<0)throw Error('日付・損益列を判別できません');
 const incoming=rows.map(row=>{let get=k=>idx[k]<0?'':row[idx[k]]||'';return {id:uid(),date:normalizeDate(get('date')),code:get('code').trim(),name:get('name').trim(),pnl:parseMoney(get('pnl')),time:get('time'),method:get('method'),tags:get('tags'),memo:get('memo'),created:stamp()}}).filter(r=>r.date&&Number.isInteger(r.pnl));
 const counts=new Map();for(const r of records){const k=[r.date,r.code,r.name,r.pnl,r.time||''].join('|');counts.set(k,(counts.get(k)||0)+1)}
 const seen=new Map(),fresh=[];for(const r of incoming){const k=[r.date,r.code,r.name,r.pnl,r.time||''].join('|'),n=(seen.get(k)||0)+1;seen.set(k,n);if(n>(counts.get(k)||0))fresh.push(r)}
 if(!confirm(`CSV ${incoming.length}件／新規 ${fresh.length}件／重複 ${incoming.length-fresh.length}件。登録しますか？`))return;
 await new Promise((ok,no)=>{const tx=db.transaction('records','readwrite');for(const r of fresh)tx.objectStore('records').put(r);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});await reload();render();toast(`${fresh.length}件を取り込みました`);
}
async function resetAll(){if(prompt('全データを削除します。「初期化」と入力してください')!=='初期化')return;await new Promise((ok,no)=>{let t=db.transaction(['records','drafts','meta'],'readwrite');for(let n of ['records','drafts','meta'])t.objectStore(n).clear();t.oncomplete=ok;t.onerror=()=>no(t.error)});await reload();month=ym(today());selected=today();go('calendar');toast('データを初期化しました')}function showGuide(){sheet('株式収支手帖の使い方',`<p>① カレンダー右下の「＋」で取引を登録します。</p><p>② 設定画面からCSV取込ができます。</p><p>③ 分析・年間成績で損益を確認できます。</p><p>④ 定期的にJSONバックアップを保存してください。</p><button class="btn primary" onclick="setmeta('guide',true);closeSheet()">使い始める</button>`)}function showBackupReminder(){sheet('バックアップのご案内',`<p>前回のバックアップから30日以上経過しています。</p><button class="btn primary" onclick="closeSheet();backup()">バックアップする</button> <button class="btn" onclick="setmeta('snooze',new Date(Date.now()+7*864e5).toISOString());closeSheet()">あとで（7日間）</button>`)}
init().catch(e=>{$('#main').innerHTML='<section class="card"><h3>保存データを読み込めません</h3><p>既存データを初期化せず、操作を停止しました。</p><button class="btn" onclick="location.reload()">再試行</button><p class="hint">'+esc(e.message)+'</p></section>'});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
